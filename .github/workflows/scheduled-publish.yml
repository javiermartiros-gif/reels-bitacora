name: Publicar reels programados

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC cada día; ajusta según tu franja
  workflow_dispatch: {}   # permite lanzarlo a mano desde GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar lo pendiente de hoy
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PUBLIC_VIDEO_HOST_URL: ${{ secrets.PUBLIC_VIDEO_HOST_URL }}
        run: python publish.py --run-due

      - name: Guardar estado actualizado del calendario
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Actualiza estado de publicaciones"
          git push
